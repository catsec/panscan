name: build

# Manual trigger only — releases are cut manually with the four binaries
# produced by ./build-all.sh, see README.
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            outname: panscan_mac
            rustflags: ''
            zigbuild: false
            upx: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            outname: panscan_linux_amd64
            rustflags: '-C target-cpu=x86-64-v3'
            zigbuild: true
            upx: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            outname: panscan_linux_arm64
            rustflags: ''
            zigbuild: true
            upx: true
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            outname: panscan_windows.exe
            rustflags: '-C target-cpu=x86-64-v3'
            zigbuild: true
            upx: true

    steps:
      - uses: actions/checkout@v6

      # Nightly + rust-src is required for `-Z build-std`, which rebuilds the
      # standard library with `panic_immediate_abort` — this strips panic
      # message formatting (saves ~10-20% on a small Rust binary) and shaves
      # more dead code out of std than a normal release build can reach.
      - name: Install Rust toolchain (nightly + rust-src)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Install zig + cargo-zigbuild
        if: matrix.zigbuild
        run: |
          sudo snap install zig --classic --beta
          cargo install cargo-zigbuild --locked

      - name: Install UPX
        if: matrix.upx
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      # `-C panic=immediate-abort` is the modern spelling of the old
      # `panic_immediate_abort` build-std feature; nightly promoted it to a
      # real panic strategy and now requires it in RUSTFLAGS rather than as
      # a build-std feature. It still needs `-Z build-std=std,panic_abort`
      # to rebuild std + panic_abort with the strategy applied.
      - name: Build (size-min via build-std + panic=immediate-abort)
        env:
          RUSTFLAGS: "${{ matrix.rustflags }} -Z unstable-options -C panic=immediate-abort"
        run: |
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }} \
              -Z build-std=std,panic_abort
          else
            cargo build --release --target ${{ matrix.target }} \
              -Z build-std=std,panic_abort
          fi

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/panscan.exe dist/${{ matrix.outname }}
          else
            cp target/${{ matrix.target }}/release/panscan dist/${{ matrix.outname }}
          fi
          ls -lh dist/${{ matrix.outname }}

      # UPX intentionally skipped for aarch64-apple-darwin: Mach-O packing on
      # Apple Silicon has historically been flaky (Gatekeeper / loader edge
      # cases) and the savings aren't worth field-debug pain on an
      # already-small native binary.
      - name: Compress with UPX (Linux + Windows only)
        if: matrix.upx
        run: |
          upx --best --lzma dist/${{ matrix.outname }}
          ls -lh dist/${{ matrix.outname }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.outname }}
          path: dist/*
