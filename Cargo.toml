[package]
name = "panscan"
version = "1.1.3"
edition = "2024"
description = "Cross-platform single-pass PAN (credit card number) discovery scanner for PCI DSS sweeps"
license = "MIT"
authors = ["catsec.com"]
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
memmap2 = "0.9"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

# Same as release but tuned for the build host's exact CPU (AVX-2, BMI2, NEON
# specific to your M-series, etc.). Use for local-only builds — resulting
# binaries are NOT portable. Invoked via build-native.sh.
[profile.release-native]
inherits = "release"
